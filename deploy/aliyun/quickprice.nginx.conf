server {
    listen 80;
    server_name 106.14.116.244;
    server_tokens off;
    client_max_body_size 6m;

    location = /quickprice-hotfix.js {
        alias /opt/quickprice/hotfix/quickprice-hotfix.js;
        default_type application/javascript;
        add_header Cache-Control "private, no-store" always;
    }

    location = /quickprice-hotfix.css {
        alias /opt/quickprice/hotfix/quickprice-hotfix.css;
        default_type text/css;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/quickprice-hotfix.css"/><script src="/quickprice-hotfix.js"></script></head>';
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
